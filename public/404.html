<!doctype html>
<html lang="fr">
  <head><meta charset="utf-8"><title>Divine Glow DZ</title></head>
  <body>
    <script>
      var path = window.location.pathname
      var query = window.location.search.slice(1)
      window.location.replace('/?p=' + encodeURIComponent(path) + (query ? '&q=' + encodeURIComponent(query) : ''))
    </script>
  </body>
</html>
