name: Deploy Divine Glow

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://qshoamspyclfzsiarbzg.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_jquRWkBwQBTNe-do77Ohuw_5h_GG1Gx
          VITE_CLOUDINARY_CLOUD_NAME: bivvwru7
          VITE_CLOUDINARY_UPLOAD_PRESET: divine_glow_products
          VITE_FIREBASE_API_KEY: AIzaSyDaXJ6ukS32peqbqtAs2BbURjFTYKwTvdw
          VITE_FIREBASE_AUTH_DOMAIN: divine-glow-dz.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: divine-glow-dz
          VITE_FIREBASE_STORAGE_BUCKET: divine-glow-dz.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: "482720009466"
          VITE_FIREBASE_APP_ID: 1:482720009466:web:12642219bb70e1c7c60d43
          VITE_FIREBASE_ENABLED: "true"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
